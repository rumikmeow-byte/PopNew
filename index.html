<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jackpot Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0f0c29;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .jackpot-box {
            width: 100%;
            max-width: 380px;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        /* Анимированное колесо ставок */
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#333 0deg 360deg);
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.35, 1.0);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Стрелка указателя */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ffd200;
            z-index: 10;
        }

        .pot-info {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #161626;
            width: 100px; height: 100px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Список игроков */
        .players-list {
            margin-top: 20px;
            text-align: left;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .player-info { display: flex; align-items: center; gap: 10px; }
        .color-badge { width: 12px; height: 12px; border-radius: 50%; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #f7971e;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="jackpot-box">
    <h3>🎡 Jackpot Банк</h3>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="pot-info">
            <span style="font-size:12px; color:#aaa;">Всего</span>
            <span id="totalPot">0 ⭐</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="addBet(100)">+100 ⭐</button>
        <button class="btn" onclick="addBet(500)">+500 ⭐</button>
        <button class="btn" onclick="addBet(1000)">+1000 ⭐</button>
    </div>

    <div class="players-list" id="playersList">
        <!-- Игроки будут добавляться сюда -->
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Цвета для разных игроков
    const colors = ['#4361ee', '#f72585', '#4cc9f0', '#7209b7', '#ffb703'];
    let players = [];
    let myBet = 0;

    function updateWheel() {
        const totalPot = players.reduce((sum, p) => sum + p.bet, 0);
        document.getElementById('totalPot').innerText = `${totalPot} ⭐`;

        if (totalPot === 0) return;

        let currentAngle = 0;
        let gradientParts = [];
        const listContainer = document.getElementById('playersList');
        listContainer.innerHTML = '';

        players.forEach((p, index) => {
            const chance = ((p.bet / totalPot) * 100).toFixed(1);
            const angle = (p.bet / totalPot) * 360;
            const nextAngle = currentAngle + angle;
            const color = colors[index % colors.length];

            gradientParts.push(`${color} ${currentAngle}deg ${nextAngle}deg`);
            currentAngle = nextAngle;

            // Рендер списка
            listContainer.innerHTML += `
                <div class="player-item">
                    <div class="player-info">
                        <div class="color-badge" style="background:${color}"></div>
                        <div>
                            <div><b>${p.name}</b></div>
                            <div style="font-size:11px; color:#aaa;">Шанс ${chance}%</div>
                        </div>
                    </div>
                    <div><b>${p.bet} ⭐</b></div>
                </div>
            `;
        });

        document.getElementById('wheel').style.background = `conic-gradient(${gradientParts.join(', ')})`;
    }

    function addBet(amount) {
        myBet += amount;
        
        // Симуляция отправки данных (или интеграция с tg.sendData)
        const user = tg.initDataUnsafe?.user?.first_name || "Вы";
        
        const existing = players.find(p => p.name === user);
        if (existing) {
            existing.bet += amount;
        } else {
            players.push({ name: user, bet: amount });
        }

        updateWheel();
        
        // Отправка боту
        tg.sendData(JSON.stringify({ type: 'jackpot_bet', bet: amount }));
    }
</script>
</body>
</html>
