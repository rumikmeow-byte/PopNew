<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftsMMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        
        .case {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .roulette-container {
            position: relative;
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            overflow: hidden;
            margin: 15px 0 20px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ffd200;
            z-index: 10;
            box-shadow: 0 0 10px #ffd200;
        }
        .roulette-pointer::before, .roulette-pointer::after {
            content: '';
            position: absolute;
            left: -6px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
        }
        .roulette-pointer::before {
            top: 0;
            border-top: 10px solid #ffd200;
        }
        .roulette-pointer::after {
            bottom: 0;
            border-bottom: 10px solid #ffd200;
        }

        .roulette-track {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }

        .card {
            width: 70px;
            height: 70px;
            margin: 0 5px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card.lose { background: rgba(255, 75, 75, 0.2); border-color: #ff4b4b; color: #ff6b6b; }
        .card.low { background: rgba(255, 215, 0, 0.15); border-color: gold; color: #ffe066; }
        .card.mid { background: rgba(0, 230, 118, 0.2); border-color: #00e676; color: #69f0ae; }
        .card.high { background: rgba(224, 64, 251, 0.25); border-color: #e040fb; color: #ea80fc; }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }
        input:focus { border-color: gold; }

        .btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 18px;
            width: 100%;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }

        .info { margin-top: 15px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <div class="logo">🎁</div>

    <div class="case">
        <h3>🔥 Рулетка коэффициентов</h3>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-track" id="track"></div>
        </div>

        <input type="number" id="betAmount" placeholder="Ставка (15 - 10000)" value="100" min="15" max="10000" inputmode="numeric">
        
        <button class="btn" id="spinBtn" onclick="startSpin()">🚀 КРУТИТЬ</button>

        <div class="info">Минимальная ставка — 15 ⭐</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const track = document.getElementById('track');
        const spinBtn = document.getElementById('spinBtn');
        const CARD_WIDTH = 80;
        let isSpinning = false;

        function createDeck() {
            track.innerHTML = '';
            const multipliers = [
                { text: 'x0.0', type: 'lose' },
                { text: 'x1.2', type: 'low' },
                { text: 'x1.5', type: 'low' },
                { text: 'x2.0', type: 'mid' },
                { text: 'x3.5', type: 'mid' },
                { text: 'x5.0', type: 'high' },
                { text: 'x20.0', type: 'high' }
            ];

            for (let i = 0; i < 60; i++) {
                const item = multipliers[Math.floor(Math.random() * multipliers.length)];
                const card = document.createElement('div');
                card.className = `card ${item.type}`;
                card.innerHTML = `<span>⭐</span><span>${item.text}</span>`;
                track.appendChild(card);
            }
        }

        createDeck();

        function startSpin() {
            if (isSpinning) return;

            const input = document.getElementById('betAmount');
            const amount = parseInt(input.value, 10);

            if (isNaN(amount) || amount < 15) {
                tg.showAlert('❌ Минимальная ставка — 15 ⭐');
                return;
            }

            if (amount > 10000) {
                tg.showAlert('❌ Максимальная ставка — 10 000 ⭐');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;

            const targetIndex = Math.floor(Math.random() * 10) + 40;
            const containerWidth = document.querySelector('.roulette-container').clientWidth;
            const offset = (targetIndex * CARD_WIDTH) - (containerWidth / 2) + (CARD_WIDTH / 2);

            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.35, 1.0)';
            track.style.transform = `translateX(-${offset}px)`;

            setTimeout(() => {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                tg.sendData(JSON.stringify({ bet: amount }));
            }, 4200);
        }
    </script>
</body>
</html>
