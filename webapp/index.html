<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GiftsMMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-header">
        <div class="channel-tag">@ECLIPSEDLF</div>
        <div class="balance-container">
            <div class="badge star-badge">⭐ <span id="star-balance">...</span></div>
        </div>
    </div>

    <main class="content">
        <div class="fee-info-bar">
            <span>🎮 Игры: комиссия 10%</span> | <span>💳 Пополнение: комиссия 5%</span>
        </div>

        <section id="tab-games" class="tab-content active">
            <!-- Краш Ракета -->
            <div class="card game-card">
                <h2>Краш Ракета 🚀 (Live)</h2>
                <div class="rocket-screen">
                    <div class="rocket-icon" id="rocket">🚀</div>
                    <div class="crash-status" id="crash-status">Ожидание...</div>
                    <div class="crash-mult" id="crash-mult">x1.00</div>
                </div>
                <div class="bet-controls">
                    <input type="number" id="crash-bet" value="10" min="10" step="10">
                    <button class="btn btn-primary" id="action-btn" onclick="handleGameAction()">Ставка</button>
                </div>
                <div class="game-result" id="game-result"></div>
            </div>

            <!-- Баттл PVP -->
            <div class="card game-card">
                <h2>Баттл (Игра #<span id="battle-id">291590</span>)</h2>
                <div class="battle-wheel-container">
                    <canvas id="battleCanvas" width="220" height="220"></canvas>
                    <div class="battle-center-info">
                        <span id="battle-total-bank">0</span> ⭐
                    </div>
                </div>
                <div class="players-list" id="players-list"></div>
                <div class="bet-presets">
                    <button onclick="setBattleBet(100)">★ 100</button>
                    <button onclick="setBattleBet(500)">★ 500</button>
                    <button onclick="setBattleBet(1000)">★ 1000</button>
                </div>
                <div class="bet-controls" style="margin-top: 10px;">
                    <input type="number" id="battle-bet" value="100">
                    <button class="btn btn-primary" onclick="joinBattle()">Вступить</button>
                </div>
            </div>
        </section>

        <!-- Пополнение TON -->
        <section id="tab-deposit" class="tab-content">
            <div class="card deposit-card">
                <h3>Пополнить через TON 💎</h3>
                <p style="font-size: 12px; color: #aaa;">Комиссия на пополнение: 5%</p>
                <div style="margin: 15px 0;">
                    <input type="number" id="ton-amount" value="1" min="0.1" step="0.5" placeholder="TON" style="width: 50%;">
                    <button class="btn btn-primary" onclick="payWithTon()">Оплатить TON</button>
                </div>
                <small style="color: #888;">Кошелек:<br><code style="font-size: 10px;">UQA6OOWd_V_-asdDgsjiHK3OYTp-FjGihgFNxpSg__dHM1h8</code></small>
            </div>
        </section>

        <!-- Вывод NFT -->
        <section id="tab-gifts" class="tab-content">
            <div class="card gifts-card">
                <h3>Заказать NFT Подарок</h3>
                <p>Стоимость вывода: 500 ⭐</p>
                <button class="btn btn-primary" onclick="requestGift('Telegram Star Gift')">Заказать (Админ вышлет)</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-games" onclick="switchTab('games')">
            <span class="icon">🚀</span>
            <span>Игры</span>
        </button>
        <button class="nav-item" id="nav-deposit" onclick="switchTab('deposit')">
            <span class="icon">💎</span>
            <span>TON</span>
        </button>
        <button class="nav-item" id="nav-gifts" onclick="switchTab('gifts')">
            <span class="icon">🎁</span>
            <span>Вывод NFT</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
