<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GiftsMMS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#020d05;--panel:#101713;--panel2:#18221b;--line:#ffffff14;--text:#f4f7f4;--muted:#8b968d;--green:#31e981;--purple:#7847e8;--gold:#ffd24a;--red:#ff5364}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#020d05;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;overflow-x:hidden}.app{width:min(100%,720px);min-height:100vh;margin:auto;padding:env(safe-area-inset-top) 8px calc(86px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 25%,#0a2811 0,#020d05 48%,#010603 100%)}
.top{height:48px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:2px 4px}.back,.more{border:0;background:transparent;color:#e8eee9;font-size:23px;width:38px;height:38px}.title{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:900;font-size:15px}.dot{width:9px;height:9px;border-radius:50%;background:#45e77b;box-shadow:0 0 10px #45e77b}.live{position:absolute;left:4px;top:55px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:900;letter-spacing:.08em;color:#fff;opacity:.95}.chips{display:flex;gap:6px;overflow:hidden;padding:4px 26px 10px 26px}.chip{height:32px;min-width:58px;border-radius:11px;border:0;color:#fff;background:linear-gradient(135deg,#6334dd,#7e45ec);font-weight:900;font-size:12px;padding:0 11px;white-space:nowrap}.chip.gold{background:#26241a}.chip.active{background:#fff;color:#1b1d1b}
.stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 0 1px,transparent 1.5px),radial-gradient(#fff 0 1px,transparent 1.5px);background-size:143px 113px,211px 179px;background-position:18px 10px,73px 38px;opacity:.72}.stars:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#173a1d33,transparent 48%)}.frog{position:relative;width:190px;filter:drop-shadow(0 20px 28px #000);animation:float 2.2s ease-in-out infinite}.frog img{width:100%;display:block}.spark{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;animation:spark 1.5s infinite}.s1{left:18%;top:34%;animation-delay:.2s}.s2{right:15%;top:43%;animation-delay:.8s}.s3{left:31%;top:15%;animation-delay:1.1s}.s4{right:29%;top:20%;animation-delay:.4s}@keyframes float{0%,100%{transform:translateY(2px) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}@keyframes spark{0%,100%{opacity:.15;transform:scale(.5)}45%{opacity:1;transform:scale(1.2)}60%{opacity:.2}}
.mults{display:flex;gap:6px;overflow:hidden;padding:0 8px 8px 34px}.mult{flex:0 0 auto;border:0;border-radius:8px;background:linear-gradient(135deg,#6637db,#7c45ee);color:#fff;padding:7px 13px;font-size:12px;font-weight:900}.mult.current{background:#fff;color:#171b18}
.board{margin:0 8px;border-radius:12px 12px 0 0;overflow:hidden;background:linear-gradient(180deg,#121a15,#0d130f);border:1px solid #ffffff0e}.thead,.player{display:grid;grid-template-columns:1fr 90px;align-items:center}.thead{height:37px;padding:0 12px;color:#78837b;font-size:11px}.player{min-height:48px;padding:4px 10px;border-top:1px solid #ffffff08}.person{display:flex;align-items:center;gap:9px;min-width:0}.avatar{width:34px;height:34px;border-radius:50%;background:#263129;display:grid;place-items:center;font-size:15px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}.starsline{font-size:10px;color:var(--gold);font-weight:800}.coef{text-align:right;font-size:12px;font-weight:900}.coef.ok{color:#65e98b}.coef.bad{color:var(--red)}
.cta{position:fixed;z-index:20;left:50%;bottom:8px;transform:translateX(-50%);width:min(704px,calc(100% - 20px));height:52px;border:0;border-radius:12px;background:#fff;color:#161a17;font-size:14px;font-weight:950;box-shadow:0 7px 28px #000b}.cta:active{transform:translateX(-50%) scale(.98)}
.sheet{position:fixed;inset:0;z-index:50;background:#0009;display:none;align-items:flex-end}.sheet.open{display:flex}.sheet-inner{width:100%;padding:18px 14px calc(18px + env(safe-area-inset-bottom));background:#111713;border-radius:22px 22px 0 0;border-top:1px solid #ffffff16}.sheet h3{margin:0 0 14px;font-size:18px}.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.amount{height:45px;border:1px solid #ffffff12;border-radius:12px;background:#1b241e;color:#fff;font-weight:900}.amount.sel{background:#fff;color:#111}.confirm{margin-top:12px;width:100%;height:48px;border:0;border-radius:12px;background:#fff;color:#101511;font-weight:950}.close{margin-top:8px;width:100%;height:42px;border:0;background:transparent;color:#8d988f;font-weight:800}
@media(max-width:380px){.frog{width:165px}.stage{height:270px}.amounts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="back" id="backBtn">‹</button><div class="title"><span class="dot"></span> GiftsMMS <span style="font-size:14px">⌄</span></div><button class="more">⋮</button></header>
<div class="live">LIVE</div>
<div class="chips"><button class="chip">⭐ 450</button><button class="chip">📦</button><button class="chip">🐸</button><button class="chip">🎁</button><button class="chip gold">⭐ 7.4</button></div>
<section class="stage"><div class="stars"></div><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><div class="frog"><img src="/frog-rocket.svg" alt="Frog rocket"></div></section>
<div class="mults"><button class="mult current">Ожидание</button><button class="mult">x3.34</button><button class="mult">x2.40</button><button class="mult">x3.27</button><button class="mult">x2.03</button></div>
<section class="board"><div class="thead"><span>Пользователь</span><span style="text-align:right">Коэффициент</span></div><div id="players"></div></section>
<button class="cta" id="betBtn">Отправить ставку</button>
</div>
<div class="sheet" id="sheet"><div class="sheet-inner"><h3>Сделать ставку</h3><div class="amounts"><button class="amount sel">100 ⭐</button><button class="amount">500 ⭐</button><button class="amount">1000 ⭐</button><button class="amount">+ Другое</button></div><button class="confirm" id="confirmBet">Подтвердить</button><button class="close" id="closeSheet">Отмена</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.expand?.();
const players=[['zakhov99','7410','x2.47','ok','🧑'],['addison_pro30','4569','x2.47','ok','🧑‍🚀'],['rlshaa_43','1411','x1.66','ok','⚪'],['maksdibotez','247','x2.47','ok','👤'],['fawdfovvh','950','x1.00','ok','DA'],['lallew','130','x1.00','ok','●'],['VIP_VYMEN','50','x1.00','ok','👩'],['RmTON','25','x1.00','ok','👤']];
const pEl=document.getElementById('players');pEl.innerHTML=players.map(p=>`<div class="player"><div class="person"><div class="avatar">${p[4]}</div><div><div class="name">${p[0]}</div><div class="starsline">⭐ ${p[1]}</div></div></div><div class="coef ${p[3]}">${p[2]}</div></div>`).join('');
const sheet=document.getElementById('sheet');document.getElementById('betBtn').onclick=()=>sheet.classList.add('open');document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('open');document.getElementById('confirmBet').onclick=()=>{sheet.classList.remove('open');document.getElementById('betBtn').textContent='Ставка отправлена ✓';setTimeout(()=>document.getElementById('betBtn').textContent='Отправить ставку',1800)};document.getElementById('backBtn').onclick=()=>tg?.close?.();document.querySelectorAll('.amount').forEach(b=>b.onclick=()=>{document.querySelectorAll('.amount').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});setInterval(()=>{document.querySelectorAll('.mult').forEach(x=>x.classList.remove('current'));const m=document.querySelectorAll('.mult');m[Math.floor(Math.random()*m.length)].classList.add('current')},2200);
</script>
</body>
</html>
