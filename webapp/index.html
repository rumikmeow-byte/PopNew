<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#120a22"><title>PopNew</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>:root{--bg:#0b0713;--p:#8b5cf6;--p2:#c026d3;--panel:#171025;--muted:#a99dbb;--line:#ffffff12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#39145e,#0b0713 40%);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:#fff}.app{max-width:540px;margin:auto;padding:16px 14px 100px}.page{display:none}.page.active{display:block}.hero,.card,.panel{border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#25163b,#151020);padding:17px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--p2));font-size:25px}.brand b{font-size:21px}.muted{color:var(--muted);font-size:12px}.balance{font-size:38px;font-weight:900;margin:22px 0 13px}.btn{width:100%;padding:13px;border-radius:15px;background:#ffffff0b;border:1px solid var(--line);margin-top:9px}.primary{background:linear-gradient(135deg,var(--p),var(--p2));font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}.card{text-align:left;min-height:110px}.ico{font-size:22px}.card b{display:block;margin-top:10px}.card span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.title{font-size:21px;font-weight:900;margin:5px 3px 12px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.input{width:100%;padding:12px;border-radius:13px;background:#0b0713;color:#fff;border:1px solid var(--line);margin-top:8px}.battle{padding:13px;border:1px solid var(--line);border-radius:17px;margin-top:9px}.badge{float:right;background:#8b5cf622;padding:5px 8px;border-radius:9px;font-size:10px}.crash{height:300px;border-radius:23px;border:1px solid var(--line);position:relative;overflow:hidden;background:radial-gradient(circle at 50% 65%,#8b5cf633,transparent 34%),#120b1e}.mult{position:absolute;inset:0;display:grid;place-items:center;font-size:50px;font-weight:1000}.rocket{position:absolute;left:18%;bottom:22%;font-size:34px;transition:.08s}.status{text-align:center;color:var(--muted);font-size:12px;margin:10px}.nav{position:fixed;z-index:10;bottom:9px;left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),520px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border-radius:21px;background:#171025ed;border:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{background:transparent;color:#958aa3;font-size:9px;padding:7px 2px;border-radius:13px}.nav button.active{background:#8b5cf622;color:#fff}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-15px);opacity:0;z-index:30;background:#251838;border:1px solid var(--line);padding:11px 14px;border-radius:14px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="app">
<section id="home" class="page active"><div class="hero"><div class="brand"><div class="logo">🎁</div><div><b>PopNew</b><div class="muted">Cases · Battles · Crash</div></div></div><div class="muted" style="margin-top:20px">Твой баланс</div><div class="balance" id="balance">0 ⭐</div><button class="btn primary" onclick="page('deposit')">💎 Пополнить баланс</button></div><div class="grid"><button class="card" onclick="freeCase()"><div class="ico">🎁</div><b>Кейс</b><span>Бесплатный раз в 24 часа</span></button><button class="card" onclick="page('battles')"><div class="ico">⚔️</div><b>Баттлы</b><span>Активные игры</span></button><button class="card" onclick="page('crash')"><div class="ico">🚀</div><b>Crash</b><span>Демо до 10x</span></button><button class="card" onclick="page('profile')"><div class="ico">👤</div><b>Профиль</b><span>Твои данные</span></button></div></section>
<section id="case" class="page"><div class="title">🎁 Бесплатный кейс</div><div class="panel" style="text-align:center"><div style="font-size:60px">🎁</div><p>Открой кейс по условиям бота.</p><button class="btn primary" onclick="freeCase()">Открыть кейс</button></div></section>
<section id="battles" class="page"><div class="title">⚔️ Баттлы</div><div class="panel"><select id="currency" class="input"><option value="stars">⭐ Stars</option><option value="ton">💎 TON</option></select><input id="players" class="input" type="number" min="2" max="10" value="10"><button class="btn primary" onclick="createBattle()">＋ Создать баттл</button></div><div id="battleList"></div></section>
<section id="crash" class="page"><div class="title">🚀 Crash <span class="muted">1.00x — 10.00x</span></div><div class="panel"><div class="crash"><div class="mult" id="mult">1.00x</div><div class="rocket" id="rocket">🚀</div></div><div class="status" id="crashStatus">Демо-режим — баланс не списывается</div><button id="crashBtn" class="btn primary" onclick="crash()">▶ Играть</button></div></section>
<section id="profile" class="page"><div class="title">👤 Профиль</div><div class="panel"><div class="row"><span>Имя</span><b id="name">—</b></div><div class="row"><span>Username</span><b id="username">—</b></div><div class="row"><span>Баланс</span><b id="pb">0 ⭐</b></div><div class="row"><span>Рефералы</span><b id="refs">0</b></div><div class="row"><span>Заработано</span><b id="earned">0 ⭐</b></div><button class="btn primary" onclick="page('deposit')">💎 Пополнить</button></div></section>
<section id="deposit" class="page"><div class="title">💎 Пополнение</div><div class="panel"><div class="muted">Сумма в ⭐</div><input id="amount" class="input" type="number" min="1" max="100" value="10"><button class="btn primary" onclick="deposit()">Создать платёж</button><button class="btn" onclick="checkPay()">✓ Проверить оплату</button><div id="pay" class="muted" style="margin-top:12px;text-align:center">Платёж создаётся через TON.</div></div></section>
<nav class="nav"><button class="active" onclick="page('home',this)"><i>⌂</i>Главная</button><button onclick="page('case',this)"><i>🎁</i>Кейс</button><button onclick="page('battles',this)"><i>⚔️</i>Баттлы</button><button onclick="page('crash',this)"><i>🚀</i>Crash</button><button onclick="page('profile',this)"><i>👤</i>Профиль</button></nav></main><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#171025');tg.setBackgroundColor('#0b0713')}let payment=null,running=false;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),2300);if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
async function api(path,opt={}){opt.headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(opt.headers||{})};let r=await fetch(path,opt),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'Ошибка');return d}
function page(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='battles')loadBattles();if(id==='profile'||id==='home')loadMe()}
async function loadMe(){try{let d=await api('/api/me'),p=d.profile,u=d.user;document.getElementById('balance').textContent=p.balance+' ⭐';document.getElementById('pb').textContent=p.balance+' ⭐';document.getElementById('name').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||'—';document.getElementById('username').textContent=u.username?'@'+u.username:'—';document.getElementById('refs').textContent=d.ref_count;document.getElementById('earned').textContent=d.ref_earned+' ⭐'}catch(e){toast(e.message)}}
async function freeCase(){try{let d=await api('/api/free-case',{method:'POST',body:'{}'});toast(d.ok?'🎉 +'+d.reward+' ⭐':d.message);if(d.profile){document.getElementById('balance').textContent=d.profile.balance+' ⭐';document.getElementById('pb').textContent=d.profile.balance+' ⭐'}}catch(e){toast(e.message)}}
async function loadBattles(){try{let d=await api('/api/battles'),b=document.getElementById('battleList');b.innerHTML=d.battles?.length?d.battles.map(x=>`<div class="battle"><span class="badge">${x.currency}</span><b>Баттл #${x.battle_id}</b><div class="muted" style="margin-top:7px">Банк: ${x.bank_stars||x.bank_ton||0} · максимум ${x.max_players} игроков</div></div>`).join(''):'<div class="muted" style="text-align:center;padding:20px">Активных баттлов нет.</div>'}catch(e){toast(e.message)}}
async function createBattle(){try{let d=await api('/api/battles',{method:'POST',body:JSON.stringify({currency:document.getElementById('currency').value,max_players:Number(document.getElementById('players').value)})});toast(d.ok?'⚔️ Баттл #'+d.battle_id+' создан':d.message);loadBattles()}catch(e){toast(e.message)}}
async function deposit(){try{let amount=Number(document.getElementById('amount').value),d=await api('/api/deposit',{method:'POST',body:JSON.stringify({amount})});if(!d.ok)return toast(d.message);payment=d;document.getElementById('pay').innerHTML=`Переведи <b>${d.ton.toFixed(4)} TON</b><br>Комментарий: <b>${d.comment}</b><br><button class="btn primary" onclick="openTon()">Открыть Tonkeeper</button>`}catch(e){toast(e.message)}}
function openTon(){if(payment?.ton_link){if(tg?.openLink)tg.openLink(payment.ton_link);else location.href=payment.ton_link}}
async function checkPay(){if(!payment)return toast('Сначала создай платёж');try{let d=await api('/api/deposit/check',{method:'POST',body:JSON.stringify({amount:payment.amount,comment:payment.comment})});toast(d.message);if(d.profile){document.getElementById('balance').textContent=d.profile.balance+' ⭐';document.getElementById('pb').textContent=d.profile.balance+' ⭐'}}catch(e){toast(e.message)}}
function crash(){if(running)return;running=true;let m=document.getElementById('mult'),r=document.getElementById('rocket'),s=document.getElementById('crashStatus'),btn=document.getElementById('crashBtn'),start=performance.now(),end=1+Math.random()*9;btn.disabled=true;s.textContent='Раунд идёт — виртуальный демо-режим';function tick(now){let t=(now-start)/1000,x=Math.min(10,1+t*.9+t*t*.1);if(x>=end||x>=10){x=Math.min(x,end);m.textContent=x.toFixed(2)+'x';s.textContent='💥 Краш на '+x.toFixed(2)+'x';r.style.left='82%';r.style.bottom='78%';running=false;btn.disabled=false;btn.textContent='▶ Играть снова';return}m.textContent=x.toFixed(2)+'x';r.style.left=(18+Math.min(64,(x-1)*7))+'%';r.style.bottom=(22+Math.min(55,(x-1)*6))+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick)}
loadMe();
</script></body></html>
