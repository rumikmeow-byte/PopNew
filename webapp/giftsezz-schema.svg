<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#0d0d0d"/><text x="60" y="90" fill="#fff" font-family="Arial" font-size="56" font-weight="700">🎁 GiftsEZZ — схема платформы</text><text x="60" y="145" fill="#aaa" font-family="Arial" font-size="24">Игры • Профиль • Stars • TON • Реальное время</text><g font-family="Arial" font-size="25" fill="#fff"><rect x="60" y="210" width="1080" height="250" rx="30" fill="#17151e" stroke="#6d35e8" stroke-width="3"/><text x="95" y="260" font-size="34" font-weight="700">📱 Пользователь / Telegram Mini App</text><text x="100" y="315">🚀 Краш — ставка → рост коэффициента → забрать</text><text x="100" y="355">⚔️ Арена — сектора по доле ставок → победитель получает банк</text><text x="100" y="395">🎁 Бесплатный кейс — подписка + 3 приглашённых → награда</text><text x="100" y="435">👤 Профиль — баланс, история, рефералы, пополнение</text><rect x="60" y="520" width="1080" height="300" rx="30" fill="#121214" stroke="#ffd700" stroke-width="3"/><text x="95" y="575" font-size="34" font-weight="700" fill="#ffd700">⚙️ Серверная логика</text><text x="100" y="630">Python / aiohttp • Telegram WebApp auth</text><text x="100" y="670">WebSocket — синхронизация игровых раундов</text><text x="100" y="710">Crash engine — коэффициент и таймер считаются на сервере</text><text x="100" y="750">Arena engine — ставки, шансы, банк и победитель</text><text x="100" y="790">Транзакции — списание и начисление баланса атомарно</text><rect x="60" y="880" width="510" height="330" rx="30" fill="#151515" stroke="#31d5ff" stroke-width="3"/><text x="90" y="935" font-size="32" font-weight="700" fill="#31d5ff">💾 Данные</text><text x="95" y="990">SQLite</text><text x="95" y="1035">• пользователи</text><text x="95" y="1075">• Stars / TON баланс</text><text x="95" y="1115">• ставки и раунды</text><text x="95" y="1155">• рефералы и награды</text><rect x="630" y="880" width="510" height="330" rx="30" fill="#151515" stroke="#6d35e8" stroke-width="3"/><text x="660" y="935" font-size="32" font-weight="700" fill="#b58cff">💎 TON</text><text x="665" y="990">TON Connect</text><text x="665" y="1035">• подключение кошелька</text><text x="665" y="1075">• депозит TON</text><text x="665" y="1115">• проверка транзакции через TonAPI</text><text x="665" y="1155">• зачисление после подтверждения</text><rect x="60" y="1270" width="1080" height="300" rx="30" fill="#17151e" stroke="#36d17b" stroke-width="3"/><text x="95" y="1325" font-size="34" font-weight="700" fill="#36d17b">🔐 Защита и честность</text><text x="100" y="1380">• Telegram initData проверяется сервером</text><text x="100" y="1420">• раунды и ставки не доверяют клиенту</text><text x="100" y="1460">• hash / seed для Provably Fair</text><text x="100" y="1500">• лимиты депозитов и защита от повторной транзакции</text><text x="100" y="1540">• реферальные начисления и free case через сервер</text><text x="60" y="1680" fill="#ffd700" font-size="38" font-weight="700">Больше, чем просто игра ✨</text></g></svg>