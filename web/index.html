<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftsEzz App</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --btn-color: var(--tg-theme-button-color, #0088cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--btn-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #00d26a;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .btn-icon {
            font-size: 24px;
        }

        .btn-market {
            background: linear-gradient(135deg, #ff9900, #ff5500);
        }

        .btn-mines {
            background: linear-gradient(135deg, #0088cc, #005588);
        }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="userAvatar">G</div>
            <div>
                <div style="font-weight: bold;" id="userName">Загрузка...</div>
                <div style="font-size: 12px; color: var(--hint-color);" id="userId">ID: ---</div>
            </div>
        </div>
    </div>

    <!-- Карточка Баланса -->
    <div class="card">
        <div class="balance-title">Ваш баланс TON</div>
        <div class="balance-amount" id="tonBalance">0.00 TON</div>
    </div>

    <!-- Кнопки Модулей -->
    <div class="grid-buttons">
        <button class="btn btn-mines" onclick="actionMines()">
            <span class="btn-icon">💣</span>
            <span>Игра «Мины»</span>
        </button>
        <button class="btn btn-market" onclick="actionMarket()">
            <span class="btn-icon">🛒</span>
            <span>Маркетплейс</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран

        // Авто-настройка цвета фона под тему Telegram
        document.documentElement.style.setProperty('--bg-color', tg.backgroundColor || '#121212');

        // Считываем данные пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
            
            document.getElementById('userName').innerText = fullName || "Игрок";
            document.getElementById('userId').innerText = `ID: ${user.id}`;
            document.getElementById('userAvatar').innerText = (user.first_name || 'G')[0].toUpperCase();
        } else {
            document.getElementById('userName').innerText = "Гость";
            document.getElementById('userId').innerText = "ID: 000000";
        }

        // Действие при клике на «Мины»
        function actionMines() {
            tg.HapticFeedback.impactOccurred('medium'); // Виброотклик
            tg.showAlert("Запуск игры «Мины»...");
        }

        // Действие при клике на «Маркетплейс»
        function actionMarket() {
            tg.HapticFeedback.impactOccurred('medium'); // Виброотклик
            tg.showAlert("Переход в Маркетплейс NFT...");
        }
    </script>
</body>
</html>
